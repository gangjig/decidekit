[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decidekit"
version = "0.2.0"
description = "Evaluate decision models: accuracy, calibration (Brier / ECE / log loss), and cost per correct decision."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Gang Ji" }]
keywords = ["evaluation", "calibration", "llm", "decision-models", "brier", "ece"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Zero required dependencies: the evaluation math is plain Python on purpose.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
decidekit = "decidekit.cli:main"

[tool.setuptools.packages.find]
include = ["decidekit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
